packages:
  - "apps/*"
  - "packages/*"
  - "tooling/*"

# Single source of truth for versions shared across workspaces.
# Reference with "catalog:" in any package.json.
catalog:
  # Dev tooling
  eslint: ^9.39.5
  prettier: ^3.9.6
  typescript: ^6.0.3

  # Web
  next: ^16.3.4
  tailwindcss: ^4.3.3

catalogs:
  react19:
    react: 19.2.3
    react-dom: 19.2.3
    "@types/react": ^19.2.18
    "@types/react-dom": ^19.2.7

onlyBuiltDependencies:
  - unrs-resolver
